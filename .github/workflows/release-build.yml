name: Package verified shared core
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      channel:
        type: string
        required: true
      release_plan_artifact:
        type: string
        required: true
permissions:
  contents: read
jobs:
  package:
    outputs:
      browser-artifact-id: ${{ steps.assets.outputs.artifact-id }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shared-core/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: .
      - name: Apply frozen package version before compilation
        run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
      - name: Build and verify actual JVM and ES5 distribution
        run: |
          npm ci --ignore-scripts --prefix shared-core
          npm --prefix shared-core run pack:core
          npm --prefix shared-core run check:core
          npm --prefix shared-core run check:js
      - name: Stage only declared compiler artifacts
        run: |
          python3 scripts/package_core_release.py
          python3 scripts/stage_release_assets.py --target shared-core --pattern 'release-dist/*'
      - id: assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-shared-core-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: release-assets/shared-core/*
          if-no-files-found: error
          retention-days: 30

  browser-release:
    needs: package
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/typescript-ci.yml@d4b21d156067ce58f89f89149bfad545e1889ae7 # main
    with:
      node-version: '22'
      run-node-ci: false
      working-directory: ottplay-foss2
      browser-matrix-file: ottplay-foss2/.github/browser-compatibility.json
      browser-release-channel: ${{ inputs.channel }}
      browser-extended: ${{ inputs.channel == 'rc' || inputs.channel == 'stable' }}
      browser-evidence-prefix: browser-release
      browser-artifact-id: ${{ needs.package.outputs.browser-artifact-id }}
      browser-artifact-path: browser-candidate
      browser-prepare-command: >-
        npm ci --ignore-scripts && node scripts/check-core.cjs &&
        node scripts/prepare-browser-candidate.cjs ../browser-candidate
      browser-test-command: node scripts/browser-acceptance.cjs
