# Qualification-only copy of core.yml; test_core_distribution.py rejects drift.
# Never include the vendor delivery job here.
name: Qualify shared-core candidate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scope:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/change-scope.yml@e71559f44e41f39ad0037bf13c7f43bbbb2ec9af
    with:
      runner: ${{ vars.CI_RUNNER_MODE == 'k3s' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'ottplay-k3s-linux-x64' || 'ubuntu-latest' }}
      force-full: true
      documentation-paths: >-
        ["CORE-DELIVERY.md", "contracts/README.md", "shared-core/README.md",
        "ottplay-foss2/README.md", "ottplay-foss2/TECHNICAL-SPEC.md",
        "ottplay-foss2/IMPLEMENTATION-STATUS.md", "ottplay-foss2/MEDIA-API.md",
        "ottplay-foss2/THIRD-PARTY-NOTICES.md",
        "ottplay-foss2/docs/ARCHITECTURE-RISKS.md",
        "ottplay-foss2/docs/DEEP-COMPATIBILITY-AUDIT-20260918.md",
        "ottplay-foss2/docs/DEVICE-CONTRACTS.md",
        "ottplay-foss2/docs/ENGINE-COMPATIBILITY.md", "ottplay-foss2/docs/EPG.md",
        "ottplay-foss2/docs/FEATURE-INVENTORY.md", "ottplay-foss2/docs/PROVIDER-API.md",
        "ottplay-foss2/docs/RELEASE-0.6.0-beta.1.md",
        "ottplay-foss2/docs/RELEASE-0.6.0-beta.2.md"]

  portable:
    needs: scope
    if: ${{ needs.scope.outputs.run != 'false' || needs.scope.outputs.reason != 'documentation-only' }}
    runs-on: ${{ vars.CI_RUNNER_MODE == 'k3s' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'ottplay-k3s-linux-x64' || 'ubuntu-latest' }}
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.distribution.outputs.artifact-id }}
      artifact-digest: ${{ steps.distribution.outputs.artifact-digest }}
    defaults:
      run:
        working-directory: shared-core
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check self-hosted runner prerequisites
        if: runner.environment == 'self-hosted'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci-runner-preflight.py base
      - name: Set up Python for workflow contract checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-workflow-contracts.txt
      - name: Validate pinned actions and RC fuzz runtime consistency
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m venv .venv-workflow
          .venv-workflow/bin/python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-workflow-contracts.txt
          .venv-workflow/bin/python scripts/workflow_contracts.py --actions-only
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shared-core/package-lock.json
      - run: npm ci
      - run: node scripts/check-boundary.cjs
      - run: node scripts/test-canonical-js.cjs
      - run: ./gradlew --no-daemon jvmTest jsNodeTest
      - run: npm run pack:core
      - run: npm run check:js
      - run: npm run check:core
      - name: Replay fuzz contracts against this run's compiler output
        run: node ../fuzz/replay.mjs
      - id: distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ottplay-shared-core
          path: shared-core/dist/
          if-no-files-found: error
          retention-days: 7

  browser-client:
    needs: [scope, portable]
    if: ${{ needs.scope.outputs.run != 'false' || needs.scope.outputs.reason != 'documentation-only' }}
    runs-on: ${{ vars.CI_RUNNER_MODE == 'k3s' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'ottplay-k3s-linux-x64' || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ottplay-foss2
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check self-hosted runner prerequisites
        if: runner.environment == 'self-hosted'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci-runner-preflight.py browser
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '^22.22.2'
          cache: npm
          cache-dependency-path: ottplay-foss2/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Verify the committed client pin before staging the candidate
        run: node scripts/check-core.cjs
      - name: Download the exact compiler output qualified by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.portable.outputs.artifact-id }}
          path: shared-core/dist
      - name: Stage the new core in the disposable browser checkout
        run: |
          npm ci --ignore-scripts --prefix ../shared-core
          node ../shared-core/scripts/distribute.cjs install-web "$PWD"
          node ../shared-core/scripts/distribute.cjs check-web "$PWD"
      - run: npm test
      # Keep custom jobs aligned with the shared toolkit browser preparation.
      - name: Prefer the provisioned Ubuntu archive fallback
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          sudo env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" "$(command -v node)" <<'NODE'
          if (process.env.RUNNER_ENVIRONMENT !== 'github-hosted' || process.env.RUNNER_OS !== 'Linux') {
            console.log('Ubuntu mirror preparation does not apply to this runner');
            process.exit(0);
          }
          const fs = require('node:fs');
          const mirrorFile = '/etc/apt/apt-mirrors.txt';
          let stat;
          try {
            stat = fs.lstatSync(mirrorFile);
          } catch (error) {
            if (error.code !== 'ENOENT') throw error;
            console.log('No image-provisioned Ubuntu mirror list; leaving APT unchanged');
            process.exit(0);
          }
          if (!stat.isFile() || stat.isSymbolicLink()) throw new Error('Ubuntu mirror list is not a regular file');
          const original = fs.readFileSync(mirrorFile);
          const text = original.toString('utf8');
          if (!Buffer.from(text).equals(original)) throw new Error('Ubuntu mirror list is not valid UTF-8');
          const lines = text.match(/[^\n]*\n|[^\n]+$/g) || [];
          const entries = lines.map((line, index) => ({index, fields: line.trim().split(/[ \t]+/)}))
            .filter(({fields}) => fields[0] && !fields[0].startsWith('#'));
          const azure = entries.filter(({fields}) => fields[0] === 'http://azure.archive.ubuntu.com/ubuntu/');
          if (!azure.length) {
            console.log('Azure Ubuntu mirror is not configured; leaving APT unchanged');
            process.exit(0);
          }
          const fallback = entries.filter(({fields}) => fields[0] === 'https://archive.ubuntu.com/ubuntu/');
          if (azure.length !== 1 || azure[0].fields.length !== 2 || azure[0].fields[1] !== 'priority:1' ||
              fallback.length !== 1 || fallback[0].fields.length !== 2 || fallback[0].fields[1] !== 'priority:2') {
            console.log('::warning::Unrecognized Ubuntu mirror configuration; leaving APT unchanged');
            process.exit(0);
          }
          const updated = lines.filter((_, index) => index !== azure[0].index).join('');
          if (!fs.readFileSync(mirrorFile).equals(original)) throw new Error('Ubuntu mirror list changed during preparation');
          fs.writeFileSync(mirrorFile, updated);
          console.log('Removed the Azure entry; retained the image-provisioned HTTPS Ubuntu fallback');
          NODE
      - name: Install Chromium on GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on the prepared self-hosted image
        if: runner.environment == 'self-hosted'
        run: npx playwright install chromium
      - name: Install ffmpeg on GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate synthetic playback fixture
        run: |
          ffmpeg -nostdin -y -f lavfi -i testsrc2=size=320x180:rate=24 -f lavfi -i sine=frequency=440 -t 8 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart "$RUNNER_TEMP/ottplay-test.mp4"
      - run: npm run test:provider-browser
        env:
          OTT2_TEST_MEDIA: ${{ runner.temp }}/ottplay-test.mp4
      - run: npm run test:epg-browser
      - run: npm run test:compat-browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: foss2-browser-reports
          path: ottplay-foss2/test-results/
          if-no-files-found: warn
          retention-days: ${{ job.status == 'success' && 1 || 3 }}

  browser-compatibility:
    needs: [scope, portable]
    if: ${{ needs.scope.outputs.run != 'false' || needs.scope.outputs.reason != 'documentation-only' }}
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/typescript-ci.yml@e71559f44e41f39ad0037bf13c7f43bbbb2ec9af
    with:
      node-version: '22'
      run-node-ci: false
      working-directory: ottplay-foss2
      browser-matrix-file: ottplay-foss2/.github/browser-compatibility.json
      browser-extended: false
      browser-artifact-id: ${{ needs.portable.outputs.artifact-id }}
      browser-artifact-path: shared-core/dist
      browser-prepare-command: >-
        npm ci --ignore-scripts && node scripts/check-core.cjs &&
        npm ci --ignore-scripts --prefix ../shared-core &&
        node ../shared-core/scripts/distribute.cjs install-web "$PWD" &&
        node ../shared-core/scripts/distribute.cjs check-web "$PWD"
      browser-test-command: node scripts/browser-acceptance.cjs

  wire-contracts:
    needs: scope
    if: ${{ needs.scope.outputs.run != 'false' || needs.scope.outputs.reason != 'documentation-only' }}
    runs-on: ${{ vars.CI_RUNNER_MODE == 'k3s' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'ottplay-k3s-linux-x64' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check self-hosted runner prerequisites
        if: runner.environment == 'self-hosted'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci-runner-preflight.py base
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache: false
      - name: Use isolated pinned consumer checkouts
        run: echo "OTTPLAY_CONSUMER_ROOT=$RUNNER_TEMP/ottplay-consumers" >> "$GITHUB_ENV"
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/checkouts.py --only ottplay-foss --only ottplay-swop --only ottplay-control-server
      - run: python3 scripts/workspace-wire.py --check

