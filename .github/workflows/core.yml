name: Shared core
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/change-scope.yml@ea1f1af3c3fc18142044314daf85cdd8c72e0a3c
    with:
      runner: ${{ vars.CI_RUNNER_MODE == 'k3s' && 'ottplay-k3s-linux-x64' || 'ubuntu-latest' }}
      force-full: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
      documentation-paths: >-
        ["contracts/README.md", "shared-core/README.md",
        "ottplay-foss2/README.md", "ottplay-foss2/TECHNICAL-SPEC.md",
        "ottplay-foss2/IMPLEMENTATION-STATUS.md", "ottplay-foss2/MEDIA-API.md",
        "ottplay-foss2/THIRD-PARTY-NOTICES.md",
        "ottplay-foss2/docs/ARCHITECTURE-RISKS.md",
        "ottplay-foss2/docs/DEEP-COMPATIBILITY-AUDIT-20260918.md",
        "ottplay-foss2/docs/DEVICE-CONTRACTS.md",
        "ottplay-foss2/docs/ENGINE-COMPATIBILITY.md", "ottplay-foss2/docs/EPG.md",
        "ottplay-foss2/docs/FEATURE-INVENTORY.md", "ottplay-foss2/docs/PROVIDER-API.md",
        "ottplay-foss2/docs/RELEASE-0.6.0-beta.1.md",
        "ottplay-foss2/docs/RELEASE-0.6.0-beta.2.md"]

  portable:
    needs: scope
    if: ${{ needs.scope.outputs.run != 'false' || needs.scope.outputs.reason != 'documentation-only' }}
    runs-on: ${{ vars.CI_RUNNER_MODE == 'k3s' && 'ottplay-k3s-linux-x64' || 'ubuntu-latest' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: shared-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check self-hosted runner prerequisites
        if: vars.CI_RUNNER_MODE == 'k3s'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci-runner-preflight.py base
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shared-core/package-lock.json
      - run: npm ci
      - run: node scripts/check-boundary.cjs
      - run: node scripts/test-canonical-js.cjs
      - run: ./gradlew --no-daemon jvmTest jsNodeTest
      - run: npm run pack:core
      - run: npm run check:js
      - run: npm run check:core
      - run: node scripts/distribute.cjs check-web ../ottplay-foss2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: ottplay-shared-core
          path: shared-core/dist/
          if-no-files-found: error
          retention-days: 1

  browser-client:
    needs: scope
    if: ${{ needs.scope.outputs.run != 'false' || needs.scope.outputs.reason != 'documentation-only' }}
    runs-on: ${{ vars.CI_RUNNER_MODE == 'k3s' && 'ottplay-k3s-linux-x64' || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ottplay-foss2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check self-hosted runner prerequisites
        if: vars.CI_RUNNER_MODE == 'k3s'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci-runner-preflight.py browser
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ottplay-foss2/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Install Chromium and hosted OS dependencies
        if: vars.CI_RUNNER_MODE != 'k3s'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on the prepared self-hosted image
        if: vars.CI_RUNNER_MODE == 'k3s'
        run: npx playwright install chromium
      - name: Install hosted playback fixture tools
        if: vars.CI_RUNNER_MODE != 'k3s'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate synthetic playback fixture
        run: |
          ffmpeg -nostdin -y -f lavfi -i testsrc2=size=320x180:rate=24 -f lavfi -i sine=frequency=440 -t 8 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart "$RUNNER_TEMP/ottplay-test.mp4"
      - run: npm run test:provider-browser
        env:
          OTT2_TEST_MEDIA: ${{ runner.temp }}/ottplay-test.mp4
      - run: npm run test:epg-browser
      - run: npm run test:compat-browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: foss2-browser-reports
          path: ottplay-foss2/test-results/
          if-no-files-found: warn
          retention-days: ${{ job.status == 'success' && 1 || 3 }}

  wire-contracts:
    needs: scope
    if: ${{ needs.scope.outputs.run != 'false' || needs.scope.outputs.reason != 'documentation-only' }}
    runs-on: ${{ vars.CI_RUNNER_MODE == 'k3s' && 'ottplay-k3s-linux-x64' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check self-hosted runner prerequisites
        if: vars.CI_RUNNER_MODE == 'k3s'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci-runner-preflight.py base
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache: false
      - name: Use isolated pinned consumer checkouts
        run: echo "OTTPLAY_CONSUMER_ROOT=$RUNNER_TEMP/ottplay-consumers" >> "$GITHUB_ENV"
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/checkouts.py --only ottplay-foss --only ottplay-swop --only ottplay-control-server
      - run: python3 scripts/workspace-wire.py --check
