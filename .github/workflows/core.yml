name: Shared core
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/change-scope.yml@dc291e8c6635d8a0c5d2cc33a4ffd83d1956625b
    with:
      force-full: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
      documentation-paths: >-
        ["CORE-DELIVERY.md", "contracts/README.md", "shared-core/README.md",
        "ottplay-foss2/README.md", "ottplay-foss2/TECHNICAL-SPEC.md",
        "ottplay-foss2/IMPLEMENTATION-STATUS.md", "ottplay-foss2/MEDIA-API.md",
        "ottplay-foss2/THIRD-PARTY-NOTICES.md",
        "ottplay-foss2/docs/ARCHITECTURE-RISKS.md",
        "ottplay-foss2/docs/DEEP-COMPATIBILITY-AUDIT-20260918.md",
        "ottplay-foss2/docs/DEVICE-CONTRACTS.md",
        "ottplay-foss2/docs/ENGINE-COMPATIBILITY.md", "ottplay-foss2/docs/EPG.md",
        "ottplay-foss2/docs/FEATURE-INVENTORY.md", "ottplay-foss2/docs/PROVIDER-API.md",
        "ottplay-foss2/docs/RELEASE-0.6.0-beta.1.md",
        "ottplay-foss2/docs/RELEASE-0.6.0-beta.2.md"]

  portable:
    needs: scope
    if: ${{ needs.scope.outputs.run != 'false' || needs.scope.outputs.reason != 'documentation-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.distribution.outputs.artifact-id }}
      artifact-digest: ${{ steps.distribution.outputs.artifact-digest }}
    defaults:
      run:
        working-directory: shared-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shared-core/package-lock.json
      - run: npm ci
      - run: node scripts/check-boundary.cjs
      - run: node scripts/test-canonical-js.cjs
      - run: ./gradlew --no-daemon jvmTest jsNodeTest
      - run: npm run pack:core
      - run: npm run check:js
      - run: npm run check:core
      - id: distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ottplay-shared-core
          path: shared-core/dist/
          if-no-files-found: error
          retention-days: 7

  browser-client:
    needs: [scope, portable]
    if: ${{ needs.scope.outputs.run != 'false' || needs.scope.outputs.reason != 'documentation-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ottplay-foss2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ottplay-foss2/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Verify the committed client pin before staging the candidate
        run: node scripts/check-core.cjs
      - name: Download the exact compiler output qualified by this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.portable.outputs.artifact-id }}
          path: shared-core/dist
      - name: Stage the new core in the disposable browser checkout
        run: |
          npm ci --ignore-scripts --prefix ../shared-core
          node ../shared-core/scripts/distribute.cjs install-web "$PWD"
          node ../shared-core/scripts/distribute.cjs check-web "$PWD"
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Generate synthetic playback fixture
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -nostdin -y -f lavfi -i testsrc2=size=320x180:rate=24 -f lavfi -i sine=frequency=440 -t 8 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart "$RUNNER_TEMP/ottplay-test.mp4"
      - run: npm run test:provider-browser
        env:
          OTT2_TEST_MEDIA: ${{ runner.temp }}/ottplay-test.mp4
      - run: npm run test:epg-browser
      - run: npm run test:compat-browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: foss2-browser-reports
          path: ottplay-foss2/test-results/
          if-no-files-found: warn
          retention-days: ${{ job.status == 'success' && 1 || 3 }}

  wire-contracts:
    needs: scope
    if: ${{ needs.scope.outputs.run != 'false' || needs.scope.outputs.reason != 'documentation-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache: false
      - name: Use isolated pinned consumer checkouts
        run: echo "OTTPLAY_CONSUMER_ROOT=$RUNNER_TEMP/ottplay-consumers" >> "$GITHUB_ENV"
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/checkouts.py --only ottplay-foss --only ottplay-swop --only ottplay-control-server
      - run: python3 scripts/workspace-wire.py --check

  deliver:
    needs: [portable, browser-client, wire-contracts]
    if: >-
      vars.CORE_DELIVERY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: open-ott-play/ottplay-foss
            destination: vendor
            files: '["ottplay-core.js","ottplay-core.jar","ottplay-core.manifest.json","ottplay-core.LICENSE.txt"]'
          - repository: open-ott-play/ottplay-android
            destination: core/vendor
            files: '["ottplay-core.jar","ottplay-core.manifest.json","ottplay-core.LICENSE.txt"]'
          - repository: open-ott-play/ottplay-core
            destination: ottplay-foss2/vendor
            files: '["ottplay-core.js","ottplay-core.manifest.json","ottplay-core.LICENSE.txt"]'
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/vendor-update.yml@829f524edc0e1701867de9b2db6a9ad5e75efc35
    with:
      toolkit-revision: '829f524edc0e1701867de9b2db6a9ad5e75efc35'
      source-workflow: .github/workflows/core.yml
      source-tree: shared-core
      artifact-id: ${{ needs.portable.outputs.artifact-id }}
      artifact-digest: ${{ needs.portable.outputs.artifact-digest }}
      artifact-files: '["ottplay-core.js","ottplay-core.d.ts","ottplay-core.jar","ottplay-core.manifest.json","ottplay-core.LICENSE.txt"]'
      manifest: ottplay-core.manifest.json
      manifest-name: ottplay-shared-core
      qualifying-jobs: '["portable","browser-client","wire-contracts"]'
      target-repository: ${{ matrix.repository }}
      destination-prefix: ${{ matrix.destination }}
      copy-files: ${{ matrix.files }}
      committer-name: ${{ vars.CORE_DELIVERY_COMMITTER_NAME }}
      committer-email: ${{ vars.CORE_DELIVERY_COMMITTER_EMAIL }}
    secrets:
      DELIVERY_TOKEN: ${{ secrets.BOT_PAT }}
      DELIVERY_SIGNING_KEY: ${{ secrets.CORE_DELIVERY_SIGNING_KEY }}
