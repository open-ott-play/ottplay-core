name: k3s runner admission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ottplay-k3s-linux-x64
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check prepared Linux image
        run: python3 scripts/ci-runner-preflight.py browser
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Check downloaded toolchains and workflow contracts
        run: |
          java -version
          node --version
          go version
          python3 -m unittest discover -s scripts/tests -v
      - name: Verify the provisioned image isolation and network access
        run: /opt/ottplay/smoke.sh linux
      - name: Install the pinned browser client dependencies
        working-directory: ottplay-foss2
        run: npm ci --ignore-scripts
      - name: Install Chromium without modifying the host image
        working-directory: ottplay-foss2
        run: npx playwright install chromium
      - name: Launch Chromium and render a page
        working-directory: ottplay-foss2
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            await page.setContent('<title>k3s admission</title><p>Browser ready</p>');
            if (await page.title() !== 'k3s admission') throw new Error('Chromium rendering failed');
          } finally {
            await browser.close();
          }
          JS
