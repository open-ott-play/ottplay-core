name: Isolated Windows WebKit media diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        version: ['1-64-0', '1-63-0', '1-62-1']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install locked toolchain and Windows media prerequisite
        env:
          TOOLCHAIN: ottplay-foss2/tools/browser-compatibility/playwright-${{ matrix.version }}
        run: |
          npm ci --prefix "$TOOLCHAIN" --ignore-scripts --omit=optional --no-audit --no-fund
          node "$TOOLCHAIN/node_modules/playwright/cli.js" install-deps chromium
          node "$TOOLCHAIN/node_modules/playwright/cli.js" install webkit
      - name: Observe actual media transport and codec capabilities
        env:
          DIAGNOSTIC_PLAYWRIGHT: ottplay-foss2/tools/browser-compatibility/playwright-${{ matrix.version }}/node_modules/playwright
        run: node scripts/diagnose-browser-media.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: diagnostic-only-windows-webkit-${{ matrix.version }}
          path: media-diagnostics/
          if-no-files-found: error
          retention-days: 7
