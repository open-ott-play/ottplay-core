version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /shared-core
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /ottplay-foss2
    groups:
      browser-dependencies:
        patterns: ["*"]
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /shared-core
    schedule:
      interval: weekly
